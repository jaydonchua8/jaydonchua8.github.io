<style>
  :root { --bg: #0c0c0e; --mint: #d3fde9; --mint-dim: #7fb79c; --p: 3px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: Lora, Georgia, "Times New Roman", serif; color: var(--mint); -webkit-tap-highlight-color: transparent; }
  #world {
    position: fixed; left: 0; top: 0; display: block; touch-action: none; cursor: grab;
    image-rendering: pixelated; image-rendering: crisp-edges;
  }
  #world.panning, #world.dragging { cursor: grabbing; }
  #world.over-piece { cursor: pointer; }
  #world.still { cursor: default; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  nav.sections button { font: inherit; }
  nav.sections button:focus { outline: none; }

  /* Section text column (the heading and the fallen piece are drawn on the canvas) */
  .sec {
    position: fixed; z-index: 5; color: var(--mint); overflow-y: auto;
    font-size: clamp(16px, 1.45vw, 21px); line-height: 1.75;
    text-shadow: 0 0 4px var(--bg), 0 0 8px var(--bg);
    scrollbar-width: thin; scrollbar-color: var(--mint-dim) transparent;
  }
  .sec[hidden] { display: none; }
  .sec .ch { opacity: 0; }
  .sec .ch.on { opacity: 1; }
  .sec p { margin: 0 0 0.9em; }
  .sec ul { list-style: none; margin: 0; padding: 0; }
  .sec li { margin: 0 0 1.05em; }
  #sec-body > :last-child, .sec li:last-child { margin-bottom: 0; }
  .sec li .t { display: block; font-weight: 700; margin: 0 0 2px; }
  .sec canvas.pxname { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  .sec li .d { display: block; }
  .sec a { color: var(--mint); text-decoration: none; border-bottom: 2px solid rgba(211, 253, 233, 0.45); word-break: break-word; }
  .sec a:hover, .sec a:focus-visible { border-bottom-color: var(--mint); background: rgba(211, 253, 233, 0.12); outline: none; }
  .sec .ph { color: var(--mint-dim); font-style: italic; }
  .back {
    position: fixed; left: 10px; top: 10px; z-index: 6; padding: 8px 12px; cursor: pointer;
    background: var(--bg); color: var(--mint); border: 2px solid var(--mint); font: 700 15px Lora, Georgia, serif;
    transform: translateY(-200%);
  }
  .back:focus-visible { transform: none; outline: none; }
</style>
</head>
<body>
<h1 class="sr-only">Jaydon Chua</h1>
<canvas id="world" aria-hidden="true"></canvas>

  <div id="sec-body"></div>
</section>
<button class="back" id="back" type="button">Back to the board</button>

<script>
(() => {
  'use strict';

  // ------------------------------------------------------------ content
  const SECTIONS = {
    about: { label: 'About me', body: `
      <p>Hi, I'm Jaydon. I'm studying computer science at the University of Illinois Urbana-Champaign in the Grainger College of Engineering, and I expect to graduate in May 2029. I like building small tools that fix one specific annoyance.</p>
      <p>Outside of credit hours you can find me playing chess, any rec sports with my friends (pickleball, basketball, football), and sometimes, SOMETIMES, Brawl Stars.</p>` },
    orderbook: { label: 'CME order book', body: `
      <p>A Java limit order book fed by a zero-allocation decoder for CME's MDP 3.0 market data, tested against packets built from CME's real production schema.</p>
      <ul>
        <li><span class="t">Speed</span><span class="d">About 9 ns per market data entry, measured with JMH.</span></li>
        <li><span class="t">Zero allocation</span><span class="d">Tests read the JVM's allocation counter over 200,000 decodes and require exactly 0 bytes.</span></li>
        <li><span class="t">Gap recovery</span><span class="d">It detects dropped packets and rebuilds from snapshots, so the book never silently drifts.</span></li>
      </ul>
      <p><a href="https://github.com/jaydonchua8/cme-orderbook" target="_blank" rel="noopener">github.com/jaydonchua8/cme-orderbook</a></p>` },
    x402: { label: 'x402-conform', body: `
      <p>A conformance test suite for x402, Coinbase's open protocol for payments over HTTP. It is written in TypeScript, covers protocol v1 and v2, and has zero runtime dependencies.</p>
      <ul>
        <li><span class="t">Proven checks</span><span class="d">Fault injection against a reference server shows that every check catches the bug it claims to.</span></li>
        <li><span class="t">Live crawl</span><span class="d">I ran it on 200 listings in Coinbase's Bazaar index. 22% failed a check, and 2 served paid content for free.</span></li>
      </ul>
      <p><a href="https://github.com/jaydonchua8/x402-conform" target="_blank" rel="noopener">github.com/jaydonchua8/x402-conform</a></p>` },
    marketmaker: { label: 'Market maker', body: `
      <p>A price-time priority matching engine and a market-making backtester with models for queue position and latency, written in pure Python.</p>
      <ul>
        <li><span class="t">Queue and latency</span><span class="d">My orders wait behind the size ahead of them, and quote changes take time to reach the book.</span></li>
        <li><span class="t">Results</span><span class="d">Over 100 seeds per setting, 10 steps of latency cut mean PnL by about 22%.</span></li>
      </ul>
      <p><a href="https://github.com/jaydonchua8/quant-mm" target="_blank" rel="noopener">github.com/jaydonchua8/quant-mm</a></p>` },
    more: { label: 'More projects', body: `
      <ul>
        <li><span class="t">trajlint</span><span class="d">Sorts agent traces into keep, repair or drop.</span>
          <a href="https://github.com/jaydonchua8/trajlint" target="_blank" rel="noopener">github.com/jaydonchua8/trajlint</a></li>
        <li><span class="t">snapcal</span><span class="d">Turns a schedule screenshot into a calendar event.</span>
          <a href="https://github.com/jaydonchua8/snapcal" target="_blank" rel="noopener">github.com/jaydonchua8/snapcal</a></li>
        <li><span class="t">LeetStrat</span><span class="d">Practice choosing an approach before writing code.</span>
          <a href="https://github.com/jaydonchua8/leetstrat" target="_blank" rel="noopener">github.com/jaydonchua8/leetstrat</a></li>
        <li><span class="t">layerblame</span><span class="d">Finds which Dockerfile line broke the build cache.</span>
          <a href="https://github.com/jaydonchua8/layerblame" target="_blank" rel="noopener">github.com/jaydonchua8/layerblame</a></li>
      </ul>` },
    experience: { label: 'Experience', body: `
      <ul>
        <li><span class="t">Tether</span><span class="d">Cofounder and engineer, 2026 to present. A proximity-based app for meeting people nearby, built through Y Combinator Startup School, where we got $25K in startup credits.</span></li>
        <li><span class="t">XPerience Coding</span><span class="d">Web Development &amp; Curriculum Intern, since May 2024</span></li>
        <li><span class="t">VHHS Computer Science Team &amp; D128 STEAM Showcase</span><span class="d">President, Aug 2024 to May 2026</span></li>
        <li><span class="t">classCalendar</span><span class="d">Software Engineer, 2024</span></li>
      </ul>` },
    contact: { label: 'Contact', body: `
      <p>The fastest way to reach me is by phone.</p>
      <ul>
        <li><span class="t" data-icon="phone">Phone</span><a href="tel:+17738499142">773-849-9142</a></li>
        <li><span class="t" data-icon="mail">Email</span><a href="mailto:jaydonc2@illinois.edu">jaydonc2@illinois.edu</a></li>
      </ul>` }
  };

  // Pieces live on an 8x8 board, tile (c, r).
  const PIECES = [
    { key: 'about',       kind: 'king',   sprite: 'king',   dark: false },
    { key: 'x402',        kind: 'bishop', sprite: 'bishop', dark: false },
    { key: 'marketmaker', kind: 'knight', sprite: 'knight', dark: true },
    { key: 'orderbook',   kind: 'rook',   sprite: 'rook',   dark: true },
    { key: 'more',        kind: 'rook',   sprite: 'rook_w', dark: false },
    { key: 'contact',     kind: 'pawn',   sprite: 'pawn',   dark: true },
    { key: 'experience',  kind: 'queen',  sprite: 'queen',  dark: false }
  ];
  const DECOR = [{ sprite: 'books' }];
  // Starting squares. 'wide' follows the reference composition; 'tall' fits a phone in portrait.
  const LAYOUTS = {
    wide: {
      tiles: { about: [4, 3], x402: [1, 3], marketmaker: [4, 0], orderbook: [2, 6], more: [5, 7], contact: [6, 4], experience: [7, 1] },
      books: [3, 4], bunny: [5, 5],
      anchor: () => ({ x: 38, y: 133, sx: AW / 2, sy: AH / 2 + 17 }),   // king square at the reference spot
      light: [-22, -23], radius: [248, 160]
    },
    tall: {
      tiles: { marketmaker: [1, 1], experience: [0, 3], x402: [3, 0], about: [4, 4], orderbook: [4, 7], contact: [7, 4], more: [7, 7] },
      books: [2, 4], bunny: [4, 2],
      anchor: () => ({ x: 0, y: 92, sx: AW / 2, sy: AH / 2 }),
      light: [0, 40], radius: [310, 200]
    }
  };
  let layoutName = 'wide';

  const ATLAS = __ATLAS__;

  // ------------------------------------------------------------ constants
  const MINT = 0xffe9fdd3 >>> 0;              // RGBA bytes d3 fd e9 ff (little endian)
  const BG = 0xff0e0c0c >>> 0;                // 0c 0c 0e ff
  const BAYER = [0, 32, 8, 40, 2, 34, 10, 42, 48, 16, 56, 24, 50, 18, 58, 26, 12, 44, 4, 36, 14, 46, 6, 38,
    60, 28, 52, 20, 62, 30, 54, 22, 3, 35, 11, 43, 1, 33, 9, 41, 51, 19, 59, 27, 49, 17, 57, 25,
    15, 47, 7, 39, 13, 45, 5, 37, 63, 31, 55, 23, 61, 29, 53, 21];
  const TH = new Float32Array(64);
  for (let i = 0; i < 64; i++) TH[i] = (BAYER[i] + 0.5) / 64;
  const NOISE = new Float32Array(4096);      // fixed noise for pixel dissolves
  { let s = 1234567; for (let i = 0; i < 4096; i++) { s = (Math.imul(s, 1103515245) + 12345) >>> 0; NOISE[i] = ((s >>> 9) & 0xffff) / 65536; } }
  const noiseAt = (x, y) => NOISE[((y & 63) << 6) | (x & 63)];
  const TW = 38, TH2 = 19;                    // tile half width / half height, art px
  const LTOP = 0.95;                          // light on lit squares at the centre of the pool
  const SEC = { LR: 88, LS: 72, TOP: 0.16 };  // the small pool of light under a fallen piece
  const T_IN = 580, T_OUT = 475, T_RISE = 515;
  // Rigid-body motion: each piece pivots on its base rim around its own centre of mass.
  const GRAV = 26;                            // gravity / moment of inertia about the rim, rad/s^2
  const E_FALL = 0.2;                         // restitution when a toppling piece strikes the board
  const TOPPLE_G = 45;                       // the click topple falls faster than the hover rocking swings
  const DEG = Math.PI / 180;
  const WOB_R = 0.87;                         // hover wobble: share of rocking speed kept each time the base lands flat
  const WOB_MIN = 3 * DEG;                    // the gentlest push still rocks it visibly
  const WOB_MAX = 11 * DEG;                   // the furthest a wobbling piece tips
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  const secEl = document.getElementById('sec');
  const secTitle = document.getElementById('sec-title');
  const secBody = document.getElementById('sec-body');
  const backBtn = document.getElementById('back');
  const nav = document.getElementById('nav');

  let P = 3, AW = 0, AH = 0, image = null, buf = null, fbuf = null;
  let camX = 0, camY = 0, boardCamX = 0, boardCamY = 0, panX = 0, panY = 0;
  let LR = 248, LS = 160;
  const light = { x: 0, y: 0 }, lightTarget = { x: 0, y: 0 };
  let lightFollows = false;
  let lightOn = 1, lightAmt = 1;              // the board light fades out while the cursor is off the page
  let dirty = true;
  const SPR = {}, FR = {};
  const LABELS = {};
  let hoverKey = null, secHover = false;
  let lastRipple = -1, secLift = 0, lastNow = 0;
  let PHYS = {};
  const view = { mode: 'board', key: null, t0: 0, dur: 0, from: null, to: null, kb: false };

  // ------------------------------------------------------------ helpers
  const tileX = (c, r) => (c - r) * TW;
  const tileY = (c, r) => (c + r) * TH2;
  const onBoard = (c, r) => c >= 0 && c < 8 && r >= 0 && r < 8;
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const easeOut = t => 1 - Math.pow(1 - t, 3);
  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const smoother = t => t * t * t * (t * (t * 6 - 15) + 10);   // zero velocity and acceleration at both ends
  function tileAtScreen(sx, sy) {
    const wx = sx + camX, wy = sy + camY;
    return { c: Math.floor((wx + 2 * wy + TW) / (2 * TW)), r: Math.floor((2 * wy - wx + TW) / (2 * TW)) };
  }
  function lightAt(d, lr, ls) {
    let t = (lr - d) / ls;
    if (t <= 0) return 0;
    if (t > 1) t = 1;
    return Math.pow(t * t * (3 - 2 * t), 1.25);
  }

  function lightPx(prm, x, y) {
    const dx = x - prm.lx, dy = 2 * (y - prm.ly), d2 = dx * dx + dy * dy;
    const L = d2 >= prm.LR * prm.LR ? 0 : lightAt(Math.sqrt(d2), prm.LR, prm.LS) * prm.SL;
    return glows.length ? Math.max(L, glowAt(x, y)) : L;
  }

  // ------------------------------------------------------------ world state
  const pieces = PIECES.map(p => ({ ...p, c: 0, r: 0, moved: false, anim: null, drag: null, rock: null }));
  const decor = DECOR.map(d => ({ ...d }));
  const bunny = { c: 0, r: 0, face: -1, state: 'sit', t0: 0, from: null, to: null, next: 0, x: 0, y: 0, h: 0, frame: 'bunny_sit', zapT0: 0, bolt: null };
  const pieceByKey = k => pieces.find(p => p.key === k);

  // ------------------------------------------------------------ sizing / camera
  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const dpr = window.devicePixelRatio || 1;
    const tallScreen = vh > vw * 1.1;
    const ideal = tallScreen ? Math.min(vw / 330, vh / 480) : Math.min(vw / 450, vh / 270);
    // keep P x dpr whole so every art pixel covers whole device pixels
    P = Math.max(1, Math.floor(ideal * dpr + 1e-6) / dpr);
    AW = Math.ceil(vw / P); AH = Math.ceil(vh / P);
    const want = tallScreen ? 'tall' : 'wide';
    if (want !== layoutName && !pieces.some(p => p.moved) && view.mode === 'board') applyLayout(want);
    canvas.width = AW; canvas.height = AH;
    canvas.style.width = AW * P + 'px'; canvas.style.height = AH * P + 'px';
    document.documentElement.style.setProperty('--p', P + 'px');
    image = ctx.createImageData(AW, AH);
    buf = new Uint32Array(image.data.buffer);
    fbuf = new Float32Array(AW * AH);
    placeCamera();
    if (!lightFollows) { setDefaultLight(); light.x = lightTarget.x; light.y = lightTarget.y; }
    if (view.mode === 'section') layoutSectionText();
    dirty = true;
  }
  function placeCamera() {
    const a = LAYOUTS[layoutName].anchor();
    boardCamX = Math.round(a.x - a.sx + panX);
    boardCamY = Math.round(a.y - a.sy + panY);
    if (view.mode === 'board') { camX = boardCamX; camY = boardCamY; }
  }
  function setDefaultLight() {
    const a = LAYOUTS[layoutName].anchor(), o = LAYOUTS[layoutName].light;
    lightTarget.x = a.x - boardCamX + o[0]; lightTarget.y = a.y - boardCamY + o[1];
  }
  function applyLayout(name) {
    layoutName = name;
    const L = LAYOUTS[name];
    [LR, LS] = L.radius;
    for (const p of pieces) { [p.c, p.r] = L.tiles[p.key]; p.anim = null; p.drag = null; }

    for (let j = 0; j < lbl.h; j++) for (let i = 0; i < lbl.w; i++) {
      if (!lbl.mask[j * lbl.w + i]) continue;
      if (fade < 1 && noiseAt(x + i, y + j) >= fade) continue;
      px(x + i, y + j, col);
    }
  }
  function tileShape(c, r, inset, col, filled) {
    const cx = tileX(c, r) - camX, cy = tileY(c, r) - camY;
    const hh = TH2 - inset;
    for (let dy = -hh; dy <= hh; dy++) {
      const hw = 2 * (hh - Math.abs(dy));
      if (filled) { for (let dx = -hw; dx <= hw; dx++) px(cx + dx, cy + dy, col); }
      else { px(cx - hw, cy + dy, col); px(cx - hw + 1, cy + dy, col); px(cx + hw, cy + dy, col); px(cx + hw - 1, cy + dy, col); }
    }
  }
  function contrast(c, r) {
    const x = Math.round(tileX(c, r) - camX), y = Math.round(tileY(c, r) - camY);
    const f = x >= 0 && y >= 0 && x < AW && y < AH ? fbuf[y * AW + x] : 0;
    return f > 0.5 ? BG : MINT;
  }

  let layout = [];   // hit areas from the last frame
  function draw(now) {
    const prm = currentParams(now);
    camX = Math.round(prm.camX); camY = Math.round(prm.camY);
    const othersFade = (view.mode === 'zoomIn' || view.mode === 'section' || view.mode === 'zoomOut') ? prm.others : 1;
    const sel = view.key ? pieceByKey(view.key) : null;

    const objs = [];
    for (const p of pieces) {
      const f = pieceFoot(p, now);
      let name = p.sprite, fade = othersFade, liftPx = f.lift;
      if (p === sel) {
        fade = 1;
        name = frameAt(p.sprite, selectedAngle(p, now));
        if (view.mode === 'rise') { const s1 = Math.sin(Math.PI * clamp01((now - view.t0) / T_RISE)); liftPx = 7 * s1 * s1; }
        if (view.mode === 'section') liftPx = Math.round(secLift);
      } else if (p.sway) {
        // same swing as the lift-back, one back-and-forth over the same time
        const u = clamp01((now - p.sway.t0) / T_RISE);
        name = frameAt(p.sprite, 12 * Math.sin(2 * Math.PI * u) * (1 - smoother(u)));
      } else if (p.rock) name = frameAt(p.sprite, p.rock.a / DEG);
      const up = SPR[p.sprite];
      objs.push({ type: 'piece', p, name, sx: f.x, sy: f.y, fy: f.y - liftPx, fade,
        shadow: up ? up.w * 0.44 : 0, shadowK: liftPx > 0.5 ? 0.55 : 0.8 });
    }
    for (const d of decor) { const f = restFoot(d); objs.push({ type: 'decor', name: d.sprite, sx: f.x, sy: f.y, fy: f.y, fade: othersFade, shadow: 0 }); }
    objs.push({ type: 'bunny', name: bunny.frame + (bunny.face > 0 ? '_r' : ''), sx: bunny.x, sy: bunny.y, fy: bunny.y - bunny.h,
      fade: othersFade, shadow: (7 - bunny.h * 0.18) * (othersFade > 0.5 ? 1 : 0), shadowK: 0.85 });

    updateGlows(now, othersFade);
    drawFloor(prm, objs.filter(o => o.fade > 0.5 || o.type === 'piece' && o.p === sel), now);

    // move hints while dragging a piece
    const dragging = pieces.find(p => p.drag);
    if (dragging) {
      for (const t of dragging.drag.legal) tileShape(t.c, t.r, 13, contrast(t.c, t.r), true);
      const tt = dragging.drag.target;
      if (tt && onBoard(tt.c, tt.r) && dragging.drag.legal.some(t => t.c === tt.c && t.r === tt.r)) tileShape(tt.c, tt.r, 2, contrast(tt.c, tt.r), false);
      tileShape(dragging.c, dragging.r, 15, contrast(dragging.c, dragging.r), false);
    }

    if (sel && prm.secUI > 0) {
      const o = objs.find(q => q.p === sel);
      reflection(o.name, o.sx, o.sy, 0.8 * prm.secUI);
    }

    // objects back to front; a dragged piece is always on top
    objs.sort((a, b) => (a.p && a.p.drag ? 1 : 0) - (b.p && b.p.drag ? 1 : 0) || a.sy - b.sy);
    layout = [];
    const lit = { lx: prm.lx, ly: prm.ly, LR: prm.LR, LS: prm.LS, SL: prm.SL, min: 0 };
    const litSel = { ...lit, min: prm.gainK };          // the opened piece is fully lit on its own screen
    for (const o of objs) {
      let gain = o.type === 'bunny' ? 1.55 : 1.06;
      if (o.type === 'piece') {
        if (hoverKey === o.p.key || o.p.drag) gain *= 1.22;
        if (o.p === sel) gain = gain + ((o.p.dark ? 2.4 : 1.65) - gain) * prm.gainK;
      }
      const puff = o.type === 'bunny' && o.fade > 0.5 && zapAge(now) >= 70 && zapped(now);
      if (puff) drawPuff(o, now); else sprite(o.name, o.sx, o.fy, gain, o.fade, o.p === sel ? litSel : lit);
      if (o.type === 'bunny') drawZapFx(o, now);
      // hit areas: a board piece uses its upright outline, so rocking never flickers the hover on and off
      const s = o.type === 'piece' && o.p !== sel ? SPR[o.p.sprite] : SPR[o.name];
      if (s && o.fade > 0.5) layout.push({ o, x: Math.round(o.sx) - s.ax, y: Math.round(o.fy) - s.ay, s });
    }

    if (othersFade > 0.5) drawBolt(now);

    // board labels above their pieces
    for (const o of objs) {
      if (o.type !== 'piece' || o.p === sel) continue;
      const lbl = LABELS[o.p.key]; if (!lbl) continue;
      const s = SPR[o.name];
      let x = Math.round(o.sx - lbl.w / 2);
      x = Math.max(2, Math.min(AW - lbl.w - 2, x));
      const y = Math.round(o.fy) - (s ? s.ay : 60) - lbl.h - 1;
      const ui = view.mode === 'board' || view.mode === 'topple' || view.mode === 'rise' ? 1 : prm.boardUI;
      // a name shows when its piece is lit
      const fade = Math.min(ui, clamp01(2.5 * (lightPx(prm, o.sx, s ? o.fy - s.ay + s.h / 2 : o.fy - 30) - 0.08)));
      if (fade <= 0) continue;
      label(lbl, x, y, hoverKey === o.p.key, fade);
      if (fade > 0.5) layout.push({ o, x, y, w: lbl.w, h: lbl.h, isLabel: true });
    }
    const uiFade = view.mode === 'board' || view.mode === 'topple' || view.mode === 'rise' ? 1 : prm.boardUI;
    if (LABELS.__hint) { const h = LABELS.__hint; label(h, Math.round((AW - h.w) / 2), AH - h.h - 20, false, uiFade); }
    if (LABELS.__name) label(LABELS.__name, 6, AH - LABELS.__name.h - 6, false, uiFade);

    // section screen: "Lift it to go back" over the fallen piece, heading in the right column
    if (sel && prm.secUI > 0) {
      const o = objs.find(q => q.p === sel), s = SPR[o.name];
      const L = secLayout(sel.key);
      const lift = LABELS.__lift, hd = L.hd;
      if (lift && s) {
        const cx = Math.round(o.sx) - s.ax + s.w / 2;
        const x = Math.round(cx - lift.w / 2), y = Math.round(o.fy) - s.ay - lift.h - 12;
        label(lift, x, y, secHover, prm.secUI);
        if (view.mode === 'section') layout.push({ o, x, y, w: lift.w, h: lift.h, isLabel: true, lift: true });
      }
      if (hd) label(hd, L.hx, L.hy, false, prm.secUI);
    }

    ctx.putImageData(image, 0, 0);
  }

  function hitTest(x, y) {
    for (let i = layout.length - 1; i >= 0; i--) {
      const L = layout[i];
      if (L.isLabel) { if (x >= L.x && y >= L.y && x < L.x + L.w && y < L.y + L.h) return L.o; continue; }
      const lx = Math.floor(x - L.x), ly = Math.floor(y - L.y);
      if (lx >= 0 && ly >= 0 && lx < L.s.w && ly < L.s.h && L.s.cov[ly * L.s.w + lx]) {
        if (L.o.type === 'decor') return null;
        return L.o;
      }
    }
    return null;
  }

  // ------------------------------------------------------------ keyboard / buttons
  document.addEventListener('keydown', e => { if (e.key === 'Escape') goBack(); });
  backBtn.addEventListener('click', goBack);
  for (const p of PIECES) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = SECTIONS[p.key].label; b.dataset.key = p.key;
    b.addEventListener('focus', () => { if (view.mode === 'board') { lightOnPiece(pieceByKey(p.key)); setHover(p.key, -4 * DEG); } });
    b.addEventListener('blur', () => { if (hoverKey === p.key) setHover(null); });
    b.addEventListener('click', () => openSection(p.key, true));
    nav.appendChild(b);
  }

  // ------------------------------------------------------------ pointer input
  let ptr = null;
  const toArt = e => ({ x: e.clientX / P, y: e.clientY / P });
  function lightOnAt(a) {
    if (lightAmt < 0.05) { light.x = a.x; light.y = a.y; }   // coming back: the light starts at the cursor
    lightFollows = true; lightTarget.x = a.x; lightTarget.y = a.y; lightOn = 1; dirty = true;
  }
  // shine the light on a piece (keyboard focus, coming back from a section)
  function lightOnPiece(p) {
    lightFollows = false; lightOn = 1;
    lightTarget.x = tileX(p.c, p.r) - boardCamX; lightTarget.y = tileY(p.c, p.r) - boardCamY - 26;
    dirty = true;
  }
  canvas.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    const a = toArt(e);
    if (view.mode === 'section') {
      const hit = hitTest(a.x, a.y);
      if (hit && hit.type === 'piece') goBack();
      return;
    }
    if (view.mode !== 'board') return;
    lightOnAt(a);
    const hit = hitTest(a.x, a.y);
    canvas.setPointerCapture(e.pointerId);
    ptr = { id: e.pointerId, sx: a.x, sy: a.y, hit, moved: false, panX0: panX, panY0: panY };
    dirty = true;
  });
  canvas.addEventListener('pointermove', e => {
    const a = toArt(e);
    const dtMove = e.pointerType === 'mouse' ? trackMouse(e) : 0;
    if (view.mode === 'section') {
      const hit = hitTest(a.x, a.y);
      const h = !!(hit && hit.type === 'piece');
      if (h !== secHover) { secHover = h; dirty = true; }
      canvas.classList.toggle('over-piece', h);
      return;
    }
    if (view.mode !== 'board') return;
    if (e.pointerType === 'mouse' || ptr) lightOnAt(a);
    if (!ptr || e.pointerId !== ptr.id) {
      const hit = hitTest(a.x, a.y);
      const k = hit && hit.type === 'piece' ? hit.p.key : null;
      if (k && k === hoverKey && dtMove > 0) {            // keeps pushing while the cursor moves across it
        const v = push();
        nudge(hit.p, Math.sign(v) * v * v * 7e-6 * dtMove);
      }
      setHover(k);
      canvas.classList.toggle('over-piece', !!hit && hit.type !== 'decor');
      return;
    }
    const dx = a.x - ptr.sx, dy = a.y - ptr.sy;
    if (!ptr.moved && Math.hypot(dx, dy) * P > 6) {
      ptr.moved = true;
      if (ptr.hit && ptr.hit.type === 'piece') {
        const p = ptr.hit.p, f = restFoot(p);
        p.anim = null; p.rock = null;
        p.drag = { footX: f.x, footY: f.y, fx0: f.x, fy0: f.y, legal: legalTiles(p), target: null, t0: performance.now() };
        hoverKey = p.key;
        canvas.classList.add('dragging');
      } else canvas.classList.add('panning');
    }
    if (!ptr.moved) return;
    if (ptr.hit && ptr.hit.type === 'piece') {
      const p = ptr.hit.p;
      p.drag.footX = p.drag.fx0 + dx; p.drag.footY = p.drag.fy0 + dy;
      p.drag.target = tileAtScreen(p.drag.footX, p.drag.footY);
      const t = p.drag.target;
      if (Math.max(Math.abs(t.c - bunny.c), Math.abs(t.r - bunny.r)) <= 1) bunnyFlee(t.c, t.r, performance.now());
    } else {
      panX = Math.max(-320, Math.min(320, ptr.panX0 - dx));
      panY = Math.max(-260, Math.min(260, ptr.panY0 - dy));
      placeCamera();
    }
    dirty = true;
  });
  function endPointer(e, cancelled) {
    if (!ptr || e.pointerId !== ptr.id) return;
    const now = performance.now();
    const hit = ptr.hit;
    canvas.classList.remove('dragging', 'panning');
    if (!ptr.moved) {
      ptr = null;
      if (!cancelled && hit && hit.type === 'piece') { openSection(hit.p.key, false); return; }
      if (!cancelled && hit && hit.type === 'bunny') zapBunny(now);
    } else if (hit && hit.type === 'piece') {
      const p = hit.p, d = p.drag;
      const t = d.target;
      const ok = !cancelled && t && d.legal.some(q => q.c === t.c && q.r === t.r);
      const from = { x: d.footX, y: d.footY }, lift0 = dragLift(p, now);
      if (ok) { p.c = t.c; p.r = t.r; p.moved = true; }
      const rest = restFoot(p);
      p.drag = null;
      const dist = Math.hypot(from.x - rest.x, from.y - rest.y);
      p.anim = reduceMotion ? null : { t0: now, dur: Math.min(460, 220 + dist * 1.6), dx: from.x - rest.x, dy: from.y - rest.y, lift: lift0 };
      if (ok && Math.max(Math.abs(p.c - bunny.c), Math.abs(p.r - bunny.r)) <= 1) bunnyFlee(p.c, p.r, now);
    }
    ptr = null;
    dirty = true;
  }
  canvas.addEventListener('pointerup', e => endPointer(e, false));
  canvas.addEventListener('pointercancel', e => endPointer(e, true));
  canvas.addEventListener('pointerleave', e => {
    if (e.pointerType === 'mouse' && !ptr && view.mode === 'board') { lightOn = 0; setHover(null); canvas.classList.remove('over-piece'); dirty = true; }
    if (view.mode === 'section' && secHover) { secHover = false; dirty = true; }
  });
  window.addEventListener('resize', resize);

  // ------------------------------------------------------------ loop
  function physics(dt) {
    const H = 1 / 480;                         // fixed sub-steps keep the integration stable and repeatable
    let active = false;
    for (let s = 0; s < dt; s += H) {
      const h = Math.min(H, dt - s);
      if (view.mode === 'topple' && !view.settled) { stepTopple(h); active = true; }
      for (const p of pieces) if (p.rock) { stepRock(p, h); active = true; }
      for (const p of pieces) if (p.sway) { if (performance.now() - p.sway.t0 < T_RISE) active = true; else { p.sway = null; dirty = true; } }
    }
    return active;
  }
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, Math.max(0, (now - (lastNow || now)) / 1000));
    lastNow = now;
    if (physics(dt)) dirty = true;
    const liftTarget = view.mode === 'section' && secHover ? 2 : 0;
    if (Math.abs(secLift - liftTarget) > 0.02) { secLift += (liftTarget - secLift) * (1 - Math.exp(-dt / 0.06)); dirty = true; }
    else secLift = liftTarget;
    if (lightAmt !== lightOn) {
      const la = reduceMotion ? lightOn : lightAmt + (lightOn - lightAmt) * (1 - Math.exp(-dt / 0.16));
      lightAmt = Math.abs(la - lightOn) < 0.004 ? lightOn : la;
      dirty = true;
    }
    if (view.mode === 'board') {
      const k = reduceMotion ? 1 : 0.16;
      if (Math.abs(light.x - lightTarget.x) > 0.05 || Math.abs(light.y - lightTarget.y) > 0.05) {
        light.x += (lightTarget.x - light.x) * k; light.y += (lightTarget.y - light.y) * k; dirty = true;
      }
    }
    if (advanceView(now)) dirty = true;
    if (updateBunny(now)) dirty = true;
    for (const p of pieces) {
      if (p.anim) { if (now - p.anim.t0 >= p.anim.dur) p.anim = null; dirty = true; }
      if (p.drag && now - p.drag.t0 < 160) dirty = true;
    }
    if (view.mode === 'section' && !reduceMotion) {
      const step = Math.floor(now / 66.7);
      if (step !== lastRipple) { lastRipple = step; dirty = true; }
    }
    if (!dirty) return;
    dirty = false;
    draw(now);
  }

  if (location.hash === '#test') {   // read-only hook for automated checks
    window.__world = { pieces, bunny, get pan() { return { x: panX, y: panY }; }, get mode() { return view.mode; }, get open() { return view.key; },
      get P() { return P; }, get cam() { return { x: camX, y: camY }; }, get light() { return { ...light }; },
      get topple() { return view.mode === 'topple' ? view.th / DEG : null; }, get bunnyH() { return bunny.h; }, get zapAge() { return zapAge(performance.now()); },
      get mouseV() { return Math.round(Math.hypot(mouse.vx, mouse.vy)); },
      get selAngle() { const p = view.key && pieceByKey(view.key); return p ? selectedAngle(p, performance.now()) : null; } };
  }
  applyLayout('wide');
  resize();
  buildLabels();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('700 13px Lora').then(buildLabels, () => {});
    document.fonts.ready.then(buildLabels);
  }
  loadAtlas().then(() => {
    bunny.next = performance.now() + 1600;
    dirty = true;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
